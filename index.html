<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Family Expense Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f1f5f9; min-height: 100vh; padding: 1.5rem; }
  .card { background: #fff; border-radius: 16px; padding: 1.5rem;
          max-width: 560px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; font-weight: 600; text-align: center; }
  .subtitle { font-size: 13px; color: #64748b; text-align: center; margin-top: 4px; }
  .total-box { background: #0f172a; border-radius: 10px; padding: 1rem;
               text-align: center; margin: 1.25rem 0; }
  .total-box .lbl { font-size: 11px; letter-spacing: .08em;
                    color: #94a3b8; text-transform: uppercase; }
  .total-box .amt { font-size: 28px; font-weight: 600; color: #fff; margin-top: 4px; }
  .trip-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;
              background: #f8fafc; border: 1px solid #e2e8f0;
              border-radius: 10px; padding: .6rem .75rem; }
  .trip-bar input { flex: 1; border: none; background: transparent;
                    font-size: 14px; outline: none; }
  .btn-new { font-size: 12px; background: #eff6ff; color: #3b82f6;
             border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  label { font-size: 11px; font-weight: 600; letter-spacing: .06em;
          color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px; }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: .55rem .75rem; border: 1px solid #e2e8f0;
    border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; }
  input:focus, select:focus { border-color: #94a3b8; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-add { width: 100%; padding: .7rem; background: #0f172a; color: #fff;
             border: none; border-radius: 10px; font-size: 15px;
             font-weight: 600; cursor: pointer; margin-top: 4px; }
  .btn-add:disabled { opacity: .5; cursor: not-allowed; }
  .btn-report { width: 100%; padding: .6rem; background: transparent;
                color: #64748b; border: 1px solid #e2e8f0; border-radius: 10px;
                font-size: 14px; cursor: pointer; margin-top: 8px; }
  .btn-report:hover { background: #f8fafc; }
  .sec-title { font-size: 11px; font-weight: 700; letter-spacing: .06em;
               text-transform: uppercase; color: #64748b; margin: 1.25rem 0 .75rem; }
  .entry { display: flex; justify-content: space-between; align-items: center;
           padding: .65rem 0; border-bottom: 1px solid #f1f5f9; }
  .entry-left .desc { font-size: 14px; font-weight: 500; }
  .entry-left .meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .entry-right .price { font-size: 15px; font-weight: 600; }
  .entry-right .who { font-size: 12px; color: #94a3b8; text-align: right; }
  .empty { text-align: center; color: #94a3b8; font-size: 13px; padding: 1rem 0; }
  .msg { font-size: 13px; color: #10b981; margin-top: 8px; text-align: center; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>Family Expense Tracker</h1>
  <p class="subtitle">Shared real-time tracking</p>

  <div class="total-box">
    <div class="lbl">Total Spent</div>
    <div class="amt" id="total">$0.00</div>
  </div>

  <!-- Trip selector -->
  <div class="trip-bar">
    <span>🗺️</span>
    <input type="text" id="tripInput" placeholder="Trip name (e.g., Phuket July 2025)" />
    <button class="btn-new" onclick="startNewTrip()">New trip</button>
  </div>
  <div id="activeTripLabel" style="font-size:13px;color:#64748b;margin-bottom:12px;">
    No trip selected — type a trip name above
  </div>

  <!-- Form -->
  <label for="desc">Item Description</label>
  <input type="text" id="desc" placeholder="e.g., Grocery, Coffee, Taxi" />

  <div class="row2">
    <div>
      <label for="amount">Amount (฿)</label>
      <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" />
    </div>
    <div>
      <label for="expDate">Date</label>
      <input type="date" id="expDate" />
    </div>
  </div>

  <div class="row2">
    <div>
      <label for="category">Category</label>
      <select id="category">
        <option value="Food & Dining">🍽 Food & Dining</option>
        <option value="Transport">🚗 Transport</option>
        <option value="Accommodation">🏨 Accommodation</option>
        <option value="Activities">🎡 Activities</option>
        <option value="Shopping">🛍 Shopping</option>
        <option value="Health">💊 Health</option>
        <option value="Communication">📱 Communication</option>
        <option value="Other">🔧 Other</option>
      </select>
    </div>
    <div>
      <label for="spentBy">Spent By</label>
      <select id="spentBy">
        <option value="Husband">Husband</option>
        <option value="Wife">Wife</option>
        <option value="Shared">Shared</option>
      </select>
    </div>
  </div>

  <button class="btn-add" id="addBtn" onclick="addExpense()">Add Expense</button>
  <button class="btn-report" onclick="viewReport()">📊 View Report</button>
  <div class="msg" id="msg"></div>

  <div class="sec-title">Recent History</div>
  <div id="history"><div class="empty">Loading shared data...</div></div>
</div>

<script>
// ── CONFIGURE THESE TWO LINES ──────────────────────────────────────────
const SUPABASE_URL  = 'https://atgmwnxtfycifxqatbta.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0Z213bnh0ZnljaWZ4cWF0YnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2Mzc5NDMsImV4cCI6MjA5NjIxMzk0M30.IWpnQXoUQ17h72MhKK90Wnu_oZ2pm_k0M2N0gwUP0oY';
// ──────────────────────────────────────────────────────────────────────

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTrip = localStorage.getItem('currentTrip') || '';

// Set today's date on load
document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

// Restore last trip
if (currentTrip) {
  document.getElementById('tripInput').value = currentTrip;
  document.getElementById('activeTripLabel').textContent = '✈️ Current trip: ' + currentTrip;
  loadHistory();
} else {
  document.getElementById('history').innerHTML = '<div class="empty">Select or create a trip to begin</div>';
}

function startNewTrip() {
  const name = document.getElementById('tripInput').value.trim();
  if (!name) { alert('Please type a trip name first'); return; }
  currentTrip = name;
  localStorage.setItem('currentTrip', name);
  document.getElementById('activeTripLabel').textContent = '✈️ Current trip: ' + name;
  loadHistory();
}

async function loadHistory() {
  if (!currentTrip) return;
  const { data, error } = await db
    .from('expenses')
    .select('*')
    .eq('trip_name', currentTrip)
    .order('expense_date', { ascending: false })
    .limit(20);
  if (error) { console.error(error); return; }
  renderHistory(data);
}

function renderHistory(rows) {
  const el = document.getElementById('history');
  if (!rows || rows.length === 0) {
    el.innerHTML = '<div class="empty">No expenses yet for this trip</div>';
    document.getElementById('total').textContent = '$0.00';
    return;
  }
  const total = rows.reduce((s, r) => s + r.amount, 0);
  document.getElementById('total').textContent = '฿' + total.toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
  el.innerHTML = rows.map(r => `
    <div class="entry">
      <div class="entry-left">
        <div class="desc">${r.description}</div>
        <div class="meta">${r.category} · ${r.expense_date}</div>
      </div>
      <div class="entry-right">
        <div class="price">฿${parseFloat(r.amount).toLocaleString('en', {minimumFractionDigits:2})}</div>
        <div class="who">${r.spent_by}</div>
      </div>
    </div>`).join('');
}

async function addExpense() {
  const desc     = document.getElementById('desc').value.trim();
  const amount   = parseFloat(document.getElementById('amount').value);
  const expDate  = document.getElementById('expDate').value;
  const category = document.getElementById('category').value;
  const spentBy  = document.getElementById('spentBy').value;

  if (!currentTrip) { alert('Please set a trip name first'); return; }
  if (!desc)         { alert('Please enter a description'); return; }
  if (!amount || amount <= 0) { alert('Please enter a valid amount'); return; }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const { error } = await db.from('expenses').insert([{
    trip_name: currentTrip,
    description: desc,
    amount: amount,
    category: category,
    spent_by: spentBy,
    expense_date: expDate
  }]);

  btn.disabled = false;
  btn.textContent = 'Add Expense';

  if (error) {
    alert('Error saving: ' + error.message);
  } else {
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('msg').textContent = '✓ Saved!';
    setTimeout(() => document.getElementById('msg').textContent = '', 2000);
    loadHistory();
  }
}

function viewReport() {
  if (!currentTrip) { alert('No trip selected'); return; }
  window.location.href = 'report.html?trip=' + encodeURIComponent(currentTrip);
}

// Real-time updates — refresh when someone else adds an expense
db.channel('expenses').on('postgres_changes',
  { event: 'INSERT', schema: 'public', table: 'expenses' },
  () => loadHistory()
).subscribe();
</script>
</body>
</html>
